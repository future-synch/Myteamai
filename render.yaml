services:
  - type: web
    name: myteamai
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HUBSPOT_API_KEY
        sync: false
      # FS-71: brochure links are read from HubSpot. Explicit rather than inferred from
      # HUBSPOT_API_KEY; an unrecognised value raises when the source is built instead of
      # silently meaning "no brochures". Nothing builds it until FS-55 wires it in.
      # The HubSpot token also needs listings, notes and files READ scopes.
      - key: BROCHURE_LINK_SOURCE
        value: hubspot
      - key: JWT_SECRET
        generateValue: true
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://myteamai.onrender.com
