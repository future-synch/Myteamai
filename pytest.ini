[pytest]
# Marker declarations. Silences PytestUnknownMarkWarning and gives
# `--markers` output that documents what each tag means.
markers =
    integration: live tests against FutureSynch HubSpot dev tenant (DEV_PORTAL_ID). Excluded from default runs. Requires HS_DEV_TOKEN. Run with: pytest -m integration
    blocked_duplicate_policy: awaits the duplicate-applicant policy decision (Q6). Excluded from default runs.
    e2e: Playwright browser tests against an in-process live server (FS-75). Offline, Claude in mock mode, never a real HubSpot tenant. Excluded from default runs. Needs `python -m playwright install chromium`. Run with: pytest -m e2e

# Default: exclude integration, blocked and e2e scenarios. Users override on
# the command line with `-m integration` (integration-only), `-m e2e`
# (browser tests only) or `-m "integration or blocked_duplicate_policy"`.
# Do not combine -m e2e with -m integration: the e2e server strips the HubSpot
# and Anthropic credentials from the process environment (docs/E2E.md).
#
# Browser-test artefacts (FS-75): keep a Playwright trace and a screenshot for
# every failing e2e test, under test-results/ (git-ignored). Passing tests leave
# nothing behind. These options come from pytest-playwright, so an environment
# without it fails fast with "unrecognized arguments": run
# `pip install -r requirements.txt`. Note that pytest-playwright empties
# test-results/ at the start of every pytest session, default runs included.
addopts = -m "not integration and not blocked_duplicate_policy and not e2e" --tracing retain-on-failure --screenshot only-on-failure --output test-results

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
