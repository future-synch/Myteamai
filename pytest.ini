[pytest]
# Marker declarations. Silences PytestUnknownMarkWarning and gives
# `--markers` output that documents what each tag means.
markers =
    integration: live tests against FutureSynch HubSpot dev tenant (portal 148226118). Excluded from default runs. Requires HS_DEV_TOKEN. Run with: pytest -m integration
    blocked_duplicate_policy: awaits the duplicate-applicant policy decision (Q6). Excluded from default runs.

# Default: exclude integration and blocked scenarios. Users override on
# the command line with `-m integration` (integration-only) or
# `-m "integration or blocked_duplicate_policy"` (everything).
addopts = -m "not integration and not blocked_duplicate_policy"

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
